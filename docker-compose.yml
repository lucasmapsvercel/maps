services:
  mongo:
    image: mongo:8.0
    entrypoint: ["sh", "/opt/maps/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: maps_root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGODB_DB_NAME: "${MONGODB_DB_NAME:-MAPS}"
    secrets:
      - mongo_root_password
      - mongo_keyfile
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - mongo_backups:/backups
      - ./scripts/mongo-entrypoint.sh:/opt/maps/mongo-entrypoint.sh:ro
      - ./scripts/mongo-healthcheck.sh:/opt/maps/mongo-healthcheck.sh:ro
      - ./scripts/mongo-backup.sh:/opt/maps/mongo-backup.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD", "sh", "/opt/maps/mongo-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  mongo-init:
    build:
      context: .
      target: tools
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_DB_NAME: "${MONGODB_DB_NAME:-MAPS}"
    secrets:
      - mongo_root_password
      - mongodb_password
    networks: [database]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  portal:
    build:
      context: .
      target: runtime
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "${PORTAL_BIND_ADDRESS:-127.0.0.1}:${PORTAL_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXTAUTH_URL: "${NEXTAUTH_URL:?Configure NEXTAUTH_URL no .env}"
      NEXTAUTH_SECRET_FILE: /run/secrets/nextauth_secret
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?Configure GOOGLE_CLIENT_ID no .env}"
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      AUTH_ALLOWED_EMAILS: "${AUTH_ALLOWED_EMAILS:?Configure AUTH_ALLOWED_EMAILS no .env}"
      PORTAL_WORKSPACE_ID: "${PORTAL_WORKSPACE_ID:-maps}"
      MONGODB_DB_NAME: "${MONGODB_DB_NAME:-MAPS}"
      MONGODB_PASSWORD_FILE: /run/secrets/mongodb_password
      GOOGLE_COLLECTION_ENABLED: "false"
    secrets:
      - nextauth_secret
      - google_client_secret
      - mongodb_password
    networks: [database, web]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 10s

networks:
  database:
    internal: true
  web:

volumes:
  mongo_data:
  mongo_config:
  mongo_backups:

secrets:
  mongo_root_password:
    file: ./.secrets/mongo-root-password.txt
  mongodb_password:
    file: ./.secrets/mongodb-password.txt
  mongo_keyfile:
    file: ./.secrets/mongo-keyfile.txt
  nextauth_secret:
    file: ./.secrets/nextauth-secret.txt
  google_client_secret:
    file: ./.secrets/google-client-secret.txt
